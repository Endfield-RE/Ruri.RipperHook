name: Build Blender 5.2 Public Backend
on:
  push:
    branches: [codex/blender-5.2]
  pull_request:
    branches: [codex/blender-5.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend52-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Initialize only public source dependencies
        shell: pwsh
        run: |
          git submodule update --init --recursive -- AssetRipper
          if ($LASTEXITCODE -ne 0) { throw 'Public dependency checkout failed' }
          foreach ($path in @('Source/Ruri.GameHook', 'Source/Endfield-GameHook', 'Source/Ruri.RipperHook/AssetRipperGameHook')) {
            if (Test-Path -LiteralPath $path) {
              if (@(Get-ChildItem -LiteralPath $path -Recurse -File -Force).Count) {
                throw "Private content present: $path"
              }
            }
          }
      - name: Build legacy public kernel and hosts from source
        shell: pwsh
        run: |
          dotnet build Source/Ruri.RipperHook.GUI/Ruri.RipperHook.GUI.csproj -c Release -p:PureRelease=true -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Public GUI build failed' }
          dotnet build Source/Ruri.RipperHook.CLI/Ruri.RipperHook.CLI.csproj -c Release -p:PureRelease=true -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Public CLI build failed' }
      - name: Inspect published assembly boundary
        shell: pwsh
        run: |
          $kernels = @(Get-ChildItem AssetRipper/Source/0Bins/AssetRipper/Release -Filter Ruri.RipperHook.dll -File)
          if ($kernels.Count -ne 1) { throw 'Expected one legacy kernel' }
          dotnet run --project Source/Build/Legacy52Audit.csproj -- $kernels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Public assembly audit failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RipperHook-Blender52-PureRelease
          path: AssetRipper/Source/0Bins/AssetRipper/Release/**
          if-no-files-found: error
          retention-days: 30
